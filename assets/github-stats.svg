<svg xmlns="http://www.w3.org/2000/svg" width="495" height="220" viewBox="0 0 495 220" role="img" aria-labelledby="title description">
  <title id="title">GitHub engineering snapshot</title>
  <desc id="description">Live repository, star, fork, experience, and current project statistics.</desc>
  <style>
    .card { fill:#0d1117; stroke:#30363d; }
    .title { fill:#58a6ff; font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .label { fill:#8b949e; font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .value { fill:#f0f6fc; font:700 23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .meta { fill:#8b949e; font:400 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .enter { animation:enter .8s ease-out both; }
    .bar { animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both; transform-box:fill-box; transform-origin:left; }
    .pulse { animation:pulse 2.8s ease-in-out infinite; }
    @keyframes enter { from { opacity:0; transform:translateY(7px); } to { opacity:1; transform:translateY(0); } }
    @keyframes grow { from { transform:scaleX(0); } to { transform:scaleX(1); } }
    @keyframes pulse { 0%,100% { opacity:.45; } 50% { opacity:1; } }
    @media (prefers-reduced-motion: reduce) {
      .enter,.bar,.pulse { animation:none !important; }
    }
  </style>
  <rect class="card" x=".5" y=".5" width="494" height="219" rx="10"/>
  <text class="title" x="22" y="34">GitHub engineering snapshot</text>
  <g class="enter" style="animation-delay:0ms">
    <text class="value" x="22" y="76">81</text>
    <text class="label" x="22" y="95">Public repos</text>
  </g>
  <g class="enter" style="animation-delay:100ms">
    <text class="value" x="260" y="76">34</text>
    <text class="label" x="260" y="95">Total stars</text>
  </g>
  <g class="enter" style="animation-delay:200ms">
    <text class="value" x="22" y="134">16</text>
    <text class="label" x="22" y="153">Total forks</text>
  </g>
  <g class="enter" style="animation-delay:300ms">
    <text class="value" x="260" y="134">15+</text>
    <text class="label" x="260" y="153">Years building</text>
  </g>
  <circle class="pulse" cx="28" cy="181" r="5" fill="#3fb950"/>
  <text class="label" x="42" y="185">Currently building</text>
  <text class="meta" x="152" y="185">writerside · pushed 2026-09-01</text>
  <text class="meta" x="384" y="207">Updated 2026-09-02</text>
</svg>
