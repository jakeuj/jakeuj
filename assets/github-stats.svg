<svg xmlns="http://www.w3.org/2000/svg" width="495" height="190" role="img" aria-label="GitHub engineering snapshot">
  <style>
    .card { fill: #0d1117; stroke: #30363d; }
    .title { fill: #58a6ff; font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .label { fill: #8b949e; font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .value { fill: #f0f6fc; font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .meta { fill: #8b949e; font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  </style>
  <rect class="card" x="0.5" y="0.5" width="494" height="189" rx="10"/>
  <text class="title" x="22" y="34">GitHub engineering snapshot</text>
  <text class="value" x="22" y="76">79</text>
  <text class="label" x="22" y="95">Public repos</text>
  <text class="value" x="260" y="76">34</text>
  <text class="label" x="260" y="95">Total stars</text>
  <text class="value" x="22" y="134">16</text>
  <text class="label" x="22" y="153">Total forks</text>
  <text class="value" x="260" y="134">15+</text>
  <text class="label" x="260" y="153">Years building</text>
  <text class="meta" x="340" y="177">Updated 2026-07-28</text>
</svg>
