<svg xmlns="http://www.w3.org/2000/svg" width="495" height="180" viewBox="0 0 495 180" role="img" aria-labelledby="title description">
  <title id="title">CodexPlugins</title>
  <desc id="description">Codex and Claude Code plugins for Evennia MUD development workflows.</desc>
  <style>
    .card { fill:#0d1117; stroke:#30363d; }
    .name { fill:#f0f6fc; font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .description { fill:#b1bac4; font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .stack { fill:#8b949e; font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .enter { animation:enter .8s ease-out both; }
    .signal { stroke-dasharray:90 410; animation:signal 5s linear infinite; }
    .pulse { animation:pulse 2.5s ease-in-out infinite; }
    @keyframes enter { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes signal { to { stroke-dashoffset:-500; } }
    @keyframes pulse { 0%,100% { opacity:.35; } 50% { opacity:1; } }
    @media (prefers-reduced-motion: reduce) {
      .enter,.signal,.pulse { animation:none !important; }
    }
  </style>
  <rect class="card" x=".5" y=".5" width="494" height="179" rx="12"/>
  <path class="signal" d="M0 2H495" fill="none" stroke="#a78bfa" stroke-width="3"/>
  <g class="enter">
    <circle class="pulse" cx="28" cy="35" r="6" fill="#a78bfa"/>
    <text class="name" x="44" y="42">CodexPlugins</text>
    <text class="description" x="22" y="82">Codex and Claude Code plugins for Evennia MUD</text>
  <text class="description" x="22" y="103">development workflows.</text>
    <path d="M22 128H473" stroke="#21262d"/>
    <text class="stack" x="22" y="157">Codex · Claude Code · Skills</text>
  </g>
</svg>
