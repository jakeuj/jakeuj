<svg xmlns="http://www.w3.org/2000/svg" width="495" height="205" viewBox="0 0 495 205" role="img" aria-labelledby="title description">
  <title id="title">Upgrade Value</title>
  <desc id="description">GW2 Nexus addon that finds embedded runes and sigils in Exotic gear and compares live Trading Post prices.</desc>
  <style>
    .card { fill:#0d1117; stroke:#30363d; }
    .name { fill:#f0f6fc; font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .description { fill:#b1bac4; font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .stack { fill:#8b949e; font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .metric { fill:#c9d1d9; font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .enter { animation:enter .8s ease-out both; }
    .signal { stroke-dasharray:90 410; animation:signal 5s linear infinite; }
    .pulse { animation:pulse 2.5s ease-in-out infinite; }
    @keyframes enter { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes signal { to { stroke-dashoffset:-500; } }
    @keyframes pulse { 0%,100% { opacity:.35; } 50% { opacity:1; } }
    @media (prefers-reduced-motion: reduce) {
      .enter,.signal,.pulse { animation:none !important; }
    }
  </style>
  <rect class="card" x=".5" y=".5" width="494" height="204" rx="12"/>
  <path class="signal" d="M0 2H495" fill="none" stroke="#f0883e" stroke-width="3"/>
  <g class="enter">
    <circle class="pulse" cx="28" cy="35" r="6" fill="#f0883e"/>
    <text class="name" x="44" y="42">Upgrade Value</text>
    <text class="description" x="22" y="82">GW2 Nexus addon that finds embedded runes and sigils in</text>
  <text class="description" x="22" y="103">Exotic…</text>
    <text class="stack" x="22" y="139">C++ · Nexus · GW2 API</text>
    <path d="M22 156H473" stroke="#21262d"/>
    <text class="metric" x="22" y="182">★ 0</text>
    <text class="metric" x="88" y="182">⑂ 0</text>
    <text class="stack" x="284" y="182">pushed 2026-08-04</text>
  </g>
</svg>
